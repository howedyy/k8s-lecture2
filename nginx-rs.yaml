apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx-rs
  labels:
    app: nginx-rs-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-rs-app
  template:
    metadata:
      labels:
        app: nginx-rs-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.21
          ports:
            - containerPort: 80
